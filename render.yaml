
services:
  - type: web
    name: Dataloom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_HOSTS
        value: dataloom-hasn.onrender.com
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
